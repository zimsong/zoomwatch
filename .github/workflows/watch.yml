name: zoomwatch

# 한국시간(KST=UTC+9) 기준 하루 4회 실행.
# zoommytrip이 00:35경 수집하고 낮에도 갱신하므로, 새벽/오전오픈/오후/저녁에 확인한다.
on:
  schedule:
    - cron: "0 16 * * *"   # KST 01:00  (전날 수집분 반영)
    - cron: "10 0 * * *"   # KST 09:10  (대한항공 인천출발 오픈 직후)
    - cron: "0 4 * * *"    # KST 13:00
    - cron: "0 12 * * *"   # KST 21:00
  workflow_dispatch: {}      # 수동 실행 버튼

permissions:
  contents: write            # state/snapshot.json 커밋용

concurrency:
  group: zoomwatch           # 실행 겹침 방지
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zoomwatch
        env:
          NOTIFY_PROVIDER: ${{ secrets.NOTIFY_PROVIDER }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 main.py

      - name: Persist (델타 스냅샷 + 보드 데이터 커밋)
        run: |
          if [ -n "$(git status --porcelain state/ docs/data.json)" ]; then
            git config user.name "zoomwatch-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/ docs/data.json
            git commit -m "update data"
            git push
          else
            echo "변화 없음 — 커밋 생략"
          fi
